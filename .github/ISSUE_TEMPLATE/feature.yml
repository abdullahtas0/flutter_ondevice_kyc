name: Feature
description: A behavior the public API cannot express yet.
title: "feature: "
labels: ["feature"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What the caller should be able to do.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Why the current API is not enough
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        A maintainer adds the `accepted` label if the change belongs in this package. Please wait for that label before opening a pull request.
