name: pull request policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  accepted-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Require a link to an accepted issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!match) {
              core.setFailed('The PR body must contain Fixes #<number> for an issue labeled accepted.');
              return;
            }
            const number = Number(match[1]);
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            if (issue.data.pull_request) {
              core.setFailed('#' + number + ' is a pull request, not an issue.');
              return;
            }
            const labels = (issue.data.labels || []).map((label) => label.name);
            if (!labels.includes('accepted')) {
              core.setFailed('Issue #' + number + ' does not have the accepted label.');
            }
