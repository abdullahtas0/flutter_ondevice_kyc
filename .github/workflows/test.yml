name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: python3 -m pip install pillow
      - run: python3 training/finetune_yolox_nano.py --self-test
      - run: python3 training/export_models.py --self-test
      - run: python3 -m py_compile training/export_yolox_onnx.py training/yolox_nano_kyc.py
